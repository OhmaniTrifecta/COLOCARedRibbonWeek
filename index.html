<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red Ribbon Week · Colorado Connections Academy</title>
<meta name="description" content="Red Ribbon Week activities for Colorado Connections Academy students.">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF7EF;
    --card: #FFFFFF;
    --ink: #1B1547;
    --muted: #625D80;
    --navy: #1B1547;
    --lavender: #C3BDFF;
    --lavender-soft: #EEEBFF;
    --red: #D7263D;
    --red-dark: #A8182C;
    --red-soft: #FFE3E6;
    --gold: #FFB627;
    --green: #2E9E6A;
    --green-soft: #DDF5E9;
    --line: #EADFD3;
    --shadow: 0 3px 0 #EADFD3, 0 10px 24px rgba(42,34,56,.06);
    --radius: 20px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Nunito", system-ui, sans-serif;
    font-size: 18px;
    line-height: 1.45;
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 12% 8%, #FFE9D6 0 120px, transparent 121px),
      radial-gradient(circle at 92% 30%, #FFE3E6 0 90px, transparent 91px);
    background-attachment: fixed;
  }
  h1, h2, h3, .display { font-family: "Fredoka", "Nunito", sans-serif; letter-spacing: .2px; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }

  header.top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  header.top .title { font-family: "Fredoka", "Nunito", system-ui, sans-serif; font-weight: 700; font-size: 22px; line-height: 1.1; }
  header.top .title small { display: block; font-weight: 500; font-size: 14px; color: var(--muted); }
  header.top .who { margin-left: auto; font-size: 14px; color: var(--muted); text-align: right; }
  header.top .who b { color: var(--ink); }
  .linkbtn { background: none; border: 0; color: var(--red); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; padding: 0; text-decoration: underline; }

  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; }
  .hero { text-align: center; padding: 32px 24px; }
  .hero h1 { font-size: clamp(30px, 6vw, 44px); margin: 8px 0 6px; color: var(--red); }
  .hero p { color: var(--muted); margin: 0 auto 20px; max-width: 460px; }

  label.field { display: block; font-weight: 700; margin: 18px 0 8px; text-align: left; }
  .hint { font-weight: 400; color: var(--muted); font-size: 15px; }
  input[type=text], textarea {
    width: 100%; font: inherit; color: var(--ink); background: #FFFCF8;
    border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; outline: none;
  }
  textarea { min-height: 120px; resize: vertical; }
  input[type=text]:focus, textarea:focus { border-color: var(--red); box-shadow: 0 0 0 4px var(--red-soft); }
  .count { text-align: right; font-size: 13px; color: var(--muted); margin-top: 4px; }

  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    font: inherit; font-weight: 700; cursor: pointer; border-radius: 999px;
    border: 2px solid var(--line); background: #fff; color: var(--ink); padding: 10px 16px;
    transition: transform .08s ease, background .15s ease, border-color .15s ease;
  }
  .chip:hover { border-color: var(--red); }
  .chip[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: #fff; }
  .chip:active { transform: scale(.97); }

  .btn {
    font-family: "Fredoka", "Nunito", system-ui, sans-serif; font-weight: 600; font-size: 20px; cursor: pointer;
    border: 0; border-radius: 16px; padding: 14px 26px; color: #fff; background: var(--red);
    box-shadow: 0 4px 0 var(--red-dark); transition: transform .08s ease, box-shadow .08s ease, opacity .15s;
  }
  .btn:hover { filter: brightness(1.05); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--red-dark); }
  .btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; box-shadow: 0 4px 0 var(--red-dark); }
  .btn.ghost { background: #fff; color: var(--ink); box-shadow: 0 4px 0 var(--line); border: 2px solid var(--line); }
  .actions { display: flex; gap: 12px; justify-content: space-between; align-items: center; margin-top: 24px; flex-wrap: wrap; }

  .menu-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin: 6px 0 14px; flex-wrap: wrap; }
  .menu-head h2 { margin: 0; font-size: 28px; }
  .progress { font-size: 15px; color: var(--muted); font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
  .tile {
    text-align: left; font: inherit; color: var(--ink); cursor: pointer; position: relative;
    background: var(--card); border: 2px solid transparent; border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 18px; transition: transform .12s ease, border-color .12s;
  }
  .tile:hover { transform: translateY(-3px); border-color: var(--red); }
  .tile .emoji { font-size: 38px; line-height: 1; display: block; margin-bottom: 10px; }
  .tile h3 { margin: 0 0 4px; font-size: 21px; }
  .tile p { margin: 0; color: var(--muted); font-size: 15px; }
  .tile .done {
    position: absolute; top: 12px; right: 12px; background: var(--green); color: #fff;
    font-size: 13px; font-weight: 700; border-radius: 999px; padding: 3px 10px; display: none;
  }
  .tile.is-done .done { display: inline-block; }

  .act-head { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
  .act-head .emoji { font-size: 44px; }
  .act-head h2 { margin: 0; font-size: 28px; }
  .lead { color: var(--muted); margin: 4px 0 8px; }

  .option-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .opt {
    font: inherit; cursor: pointer; text-align: center; color: var(--ink); background: #fff;
    border: 3px solid var(--line); border-radius: 18px; padding: 16px 10px; font-weight: 700;
    transition: transform .08s, border-color .15s, background .15s;
  }
  .opt .big { font-size: 40px; display: block; margin-bottom: 6px; }
  .opt small { display: block; font-weight: 400; color: var(--muted); font-size: 14px; margin-top: 2px; }
  .opt:hover { border-color: var(--red); }
  .opt[aria-pressed="true"] { border-color: var(--red); background: var(--red-soft); }

  .pledge {
    background: var(--red-soft); border-left: 6px solid var(--red); border-radius: 14px;
    padding: 18px 20px; font-family: "Fredoka", "Nunito", system-ui, sans-serif; font-size: 21px; line-height: 1.4; margin: 14px 0;
  }
  .check { display: flex; gap: 12px; align-items: center; font-weight: 700; cursor: pointer; margin-top: 8px; }
  .check input { width: 28px; height: 28px; accent-color: var(--red); }

  .scenario { border-top: 2px dashed var(--line); padding-top: 18px; margin-top: 18px; }
  .scenario:first-of-type { border-top: 0; padding-top: 0; }
  .scenario h3 { margin: 0 0 10px; font-size: 20px; }
  .answers { display: grid; gap: 10px; }
  .answer {
    font: inherit; text-align: left; cursor: pointer; background: #fff; color: var(--ink);
    border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; font-weight: 600;
  }
  .answer:hover { border-color: var(--red); }
  .answer[aria-pressed="true"] { border-color: var(--red); background: var(--red-soft); }
  .feedback { margin-top: 10px; border-radius: 12px; padding: 10px 14px; font-weight: 600; display: none; }
  .feedback.good { display: block; background: var(--green-soft); color: #1C6B47; }
  .feedback.think { display: block; background: #FFF1D6; color: #7A5200; }

  .bingo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
  .sq {
    font: inherit; cursor: pointer; aspect-ratio: 1 / 1; border-radius: 16px; background: #fff;
    border: 3px solid var(--line); color: var(--ink); font-weight: 700; font-size: 15px; padding: 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; position: relative; min-width: 0; overflow-wrap: anywhere;
  }
  .sq .big { font-size: 30px; }
  .sq[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: #fff; }
  .sq[aria-pressed="true"]::after {
    content: "✓"; position: absolute; top: 6px; right: 10px; font-size: 18px;
  }
  .bingo-banner { text-align: center; font-family: "Fredoka", "Nunito", system-ui, sans-serif; font-size: 26px; color: var(--red); margin-top: 12px; min-height: 34px; }

  .logo { width: 52px; height: 52px; border-radius: 50%; flex: none; box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--lavender); }
  .flyer { display: block; width: min(260px, 70%); height: auto; margin: 0 auto 10px; border-radius: 14px; box-shadow: 0 8px 22px rgba(27,21,71,.18); transform: rotate(-2deg); }
  .theme { display: inline-block; background: var(--navy); color: #fff; font-weight: 700; font-size: 14px; border-radius: 999px; padding: 6px 14px; margin-bottom: 6px; }

  .info-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-top: 18px; }
  .info { border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
  .info h3 { margin: 0 0 6px; font-size: 21px; }
  .info p { margin: 0 0 14px; font-size: 16px; }
  .info.contest { background: linear-gradient(135deg, #FFF1D6, #FFE3E6); }
  .info .meta { font-size: 14px; color: var(--muted); margin: -6px 0 14px; }
  a.btn { display: inline-block; text-decoration: none; text-align: center; }
  .btn.navy { background: var(--navy); box-shadow: 0 4px 0 #0C0926; font-size: 18px; }
  .btn.small { font-size: 17px; padding: 11px 18px; }


  .drop {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    border: 3px dashed var(--line); border-radius: 18px; padding: 26px 16px; text-align: center; cursor: pointer;
    background: #FFFCF8; font-weight: 700;
  }
  .drop:hover, .drop:focus-within { border-color: var(--red); }
  .drop .big { font-size: 44px; }
  .drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .preview-img { display: block; max-width: 100%; max-height: 340px; margin: 12px auto 0; border-radius: 14px; box-shadow: var(--shadow); }

  .week { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 12px 0 20px; }
  .day {
    font: inherit; cursor: pointer; text-align: center; color: var(--ink); background: #fff;
    border: 3px solid var(--line); border-radius: 16px; padding: 12px 8px; font-weight: 600; font-size: 15px;
    display: flex; flex-direction: column; align-items: center; gap: 2px; line-height: 1.25;
  }
  .day .big { font-size: 30px; }
  .day b { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .day small { margin-top: 4px; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px; background: #F4EEE7; color: var(--muted); }
  .day:hover:not([disabled]) { border-color: var(--red); }
  .day[aria-pressed="true"] { border-color: var(--red); background: var(--red-soft); }
  .day-today small { background: var(--red); color: #fff; }
  .day-done small { background: var(--green); color: #fff; }
  .day-late small { background: #FFF1D6; color: #7A5200; }
  .day[disabled] { opacity: .5; cursor: not-allowed; }
  .spirit-card { display: flex; gap: 16px; align-items: center; background: linear-gradient(135deg, #FFF1D6, #FFE3E6); border-radius: 18px; padding: 18px; }
  .spirit-card .big { font-size: 56px; line-height: 1; }
  .spirit-card h3 { margin: 2px 0; font-size: 24px; }
  .spirit-card p { margin: 0; }
  .spirit-card small { font-weight: 700; color: var(--red-dark); text-transform: uppercase; font-size: 13px; letter-spacing: .4px; }
  .spirit-card.soon { display: block; text-align: center; }

  .status { margin-top: 14px; font-weight: 700; min-height: 24px; }
  .status.err { color: var(--red-dark); }

  .thanks { text-align: center; padding: 40px 24px; }
  .thanks .big { font-size: 72px; }
  .thanks h2 { font-size: 34px; color: var(--red); margin: 8px 0; }

  .preview-note {
    background: #2A2238; color: #fff; font-size: 14px; text-align: center; padding: 8px 12px; display: none;
  }
  .hidden { display: none !important; }
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
  .confetti i { position: absolute; top: -20px; width: 10px; height: 16px; border-radius: 3px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  @media (prefers-reduced-motion: reduce) { .confetti { display: none; } .tile, .btn, .chip { transition: none; } }

  @media (max-width: 520px) {
    body { font-size: 17px; }
    .card { padding: 18px; }
    .sq { font-size: 13px; }
    .sq .big { font-size: 24px; }
    header.top .title { font-size: 19px; }
    header.top .title small { font-size: 12px; }
    .logo { width: 44px; height: 44px; }
  }
</style>
</head>
<body>
<div class="preview-note" id="previewNote">Preview mode: answers are not being saved yet. (Setup: add the Google Apps Script link to config.js.)</div>
<div class="wrap">
  <header class="top">
    <img class="logo" src="assets/logo.png" alt="Colorado Connections Academy logo">
    <div class="title">Red Ribbon Week<small>Colorado Connections Academy</small></div>
    <div class="who hidden" id="who"><b id="whoName"></b> · Grade <span id="whoGrade"></span><br><button class="linkbtn" id="switchUser" type="button">Not you?</button></div>
  </header>

  <main id="app" aria-live="polite"></main>

</div>
<div class="confetti" id="confetti" aria-hidden="true"></div>

<script src="config.js"></script>
<script>
(function () {
  "use strict";

  /* ---------- Settings ---------- */
  var COUNSELOR = { name: "Mrs. Pernal" };
  var CONTEST_URL = "https://www.redribbon.org/contest";
  var THEME = "Make a Difference. Be a Hero. Stay Drug Free.";
  var FLYER_SRC = "assets/flyer.jpg";


  /* ---------- Content ---------- */
  var GRADES = [
    { id: "K", label: "K", band: "K-2" }, { id: "1", label: "1st", band: "K-2" }, { id: "2", label: "2nd", band: "K-2" },
    { id: "3", label: "3rd", band: "3-5" }, { id: "4", label: "4th", band: "3-5" }, { id: "5", label: "5th", band: "3-5" },
    { id: "6", label: "6th", band: "6-8" }, { id: "7", label: "7th", band: "6-8" }, { id: "8", label: "8th", band: "6-8" }
  ];

  var ACTIVITIES = [
    { id: "spirit",   emoji: "🎉", title: "Spirit Day Check-In", blurb: "Tell us how you dressed up today!" },
    { id: "pledge",   emoji: "🎗️", title: "Take the Pledge",     blurb: "Make your promise to stay drug-free." },
    { id: "slogan",   emoji: "📣", title: "Slogan Contest",      blurb: "Write a catchy Red Ribbon slogan." },
    { id: "scenarios",emoji: "🤔", title: "What Would You Do?",  blurb: "Practice making smart choices." },
    { id: "bingo",    emoji: "✅", title: "Healthy Choices Bingo", blurb: "Mark the healthy things you did." },
    { id: "future",   emoji: "🌟", title: "My Bright Future",    blurb: "Share your big dreams." },
    { id: "photo",    emoji: "📸", title: "Share a Photo",       blurb: "Send a picture of your spirit day or poster." }
  ];

  /* Spirit days: each one opens on its date (YYYY-MM-DD). */
  var SPIRIT_DAYS = [
    { date: "2026-10-23", day: "Fri, Oct 23", big: "❤️", name: "Wear Red",            sub: "Wear something red" },
    { date: "2026-10-26", day: "Mon, Oct 26", big: "😎", name: "My Future Is Bright", sub: "Wear sunglasses" },
    { date: "2026-10-27", day: "Tue, Oct 27", big: "🏈", name: "Team Up", sub: "Wear a jersey or team colors" },
    { date: "2026-10-28", day: "Wed, Oct 28", big: "🧦", name: "Sock It to Drugs",    sub: "Wear crazy socks" },
    { date: "2026-10-29", day: "Thu, Oct 29", big: "🎩", name: "Hats Off", sub: "Wear a fun hat" },
    { date: "2026-10-30", day: "Fri, Oct 30", big: "🎃", name: "Say Boo to Drugs",   sub: "Wear a costume" }
  ];

  /* Today's date in the student's time zone. For testing, add ?day=2026-10-26 to the address. */
  function todayISO() {
    var m = /[?&]day=(\d{4}-\d{2}-\d{2})/.exec(location.search);
    if (m) return m[1];
    var d = new Date();
    return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
  }
  function spiritToday() { var t = todayISO(); return SPIRIT_DAYS.filter(function (d) { return d.date === t; })[0] || null; }
  function nextSpiritDay() { var t = todayISO(); return SPIRIT_DAYS.filter(function (d) { return d.date > t; })[0] || null; }

  var PLEDGE = {
    "K-2": "I promise to take care of my body. I will only take medicine from a grown-up I trust, and I will say NO to things that can hurt me.",
    "3-5": "I pledge to make healthy choices. I will say no to drugs, alcohol, and vaping, and I will talk to a trusted adult when I need help.",
    "6-8": "I pledge to live drug-free. I will make choices that protect my health and my future, stand up to peer pressure, and help my friends do the same."
  };
  var REASONS = [
    "💪 I want to be healthy", "🧠 I want a strong brain", "🏆 I have big goals",
    "👨‍👩‍👧 My family", "⚽ Sports & activities", "🤝 My friends", "😊 I like being me"
  ];

  var SLOGAN_PROMPT = {
    "K-2": "Finish the sentence: \"I say NO to drugs because…\"",
    "3-5": "Write a short, catchy slogan for a Red Ribbon poster.",
    "6-8": "Write a slogan that would make someone your age stop and think."
  };

  var SCENARIOS = {
    "K-2": [
      { q: "You find little pills on the table that look like candy. What do you do?", a: [
        { t: "Eat one — it looks yummy!", good: false, f: "Pills can look like candy, but they can make you very sick. Always ask a grown-up first." },
        { t: "Leave them and tell a grown-up.", good: true, f: "Yes! Telling a grown-up keeps everyone safe." },
        { t: "Share them with a friend.", good: false, f: "That could make your friend sick. Tell a grown-up instead." } ] },
      { q: "A friend says, \"Let's play with the cleaning bottles under the sink!\" What do you say?", a: [
        { t: "\"No way! Let's play tag instead.\"", good: true, f: "Great choice! Cleaning bottles are not toys." },
        { t: "\"Okay, let's open them!\"", good: false, f: "Cleaning stuff can hurt your eyes, skin, and tummy. Pick a different game." },
        { t: "Hide them so nobody finds them.", good: false, f: "It's better to leave them alone and tell a grown-up." } ] },
      { q: "You feel really sad and grumpy. What can help?", a: [
        { t: "Talk to someone I love.", good: true, f: "Yes! Sharing feelings helps a lot." },
        { t: "Take three big, slow breaths.", good: true, f: "Yes! Deep breaths help your body calm down." },
        { t: "Keep it all inside forever.", good: false, f: "Big feelings are okay. Telling someone helps them feel smaller." } ] }
    ],
    "3-5": [
      { q: "An older kid at the bus stop offers you a vape and says, \"Everybody does it.\" What do you do?", a: [
        { t: "Say \"No thanks\" and walk away.", good: true, f: "Nice! A clear \"no\" and leaving is a strong move." },
        { t: "Try it once so they think you're cool.", good: false, f: "Vapes have nicotine, which is addictive and harms growing brains. Not everybody does it!" },
        { t: "Say no, and tell a trusted adult later.", good: true, f: "Great choice — telling an adult helps keep other kids safe too." } ] },
      { q: "A friend dares you to taste a drink from an adult's beer can. What do you say?", a: [
        { t: "\"Nah, let's play a game instead.\"", good: true, f: "Changing the subject is a smart way to say no." },
        { t: "Do it — it's just a dare.", good: false, f: "Alcohol is not safe for kids' bodies or brains. You can always skip a dare." },
        { t: "Pretend to drink it.", good: false, f: "You don't have to pretend. A real \"no\" is okay!" } ] },
      { q: "You see an online video of kids doing a dangerous \"challenge\" with medicine. What do you do?", a: [
        { t: "Try it to see what happens.", good: false, f: "These challenges have hurt real kids. Never take medicine as a game." },
        { t: "Tell a parent or teacher about it.", good: true, f: "Yes! Adults can help report it and keep others safe." },
        { t: "Share it with friends.", good: false, f: "Sharing spreads danger. Tell a trusted adult instead." } ] }
    ],
    "6-8": [
      { q: "At a hangout, someone passes around a vape and everyone is watching to see what you do.", a: [
        { t: "Say \"I'm good\" and change the subject.", good: true, f: "Confident and simple — that's often all it takes." },
        { t: "Take it so it's not awkward.", good: false, f: "The awkward moment passes; nicotine addiction doesn't. Real friends respect a no." },
        { t: "Text a parent a code word so they call you home.", good: true, f: "Smart! Having an exit plan is a great strategy." } ] },
      { q: "A friend tells you they've been taking a parent's prescription pills to deal with stress. What do you do?", a: [
        { t: "Keep it secret so they don't get in trouble.", good: false, f: "This is a secret that's not safe to keep. Their health matters more." },
        { t: "Tell a trusted adult or the school counselor.", good: true, f: "That takes courage — and it could protect your friend's life." },
        { t: "Tell them it's no big deal.", good: false, f: "Taking someone else's prescription can be very dangerous. Get an adult involved." } ] },
      { q: "Someone online offers you \"study pills\" to help you focus for a test.", a: [
        { t: "Buy a few — everyone wants better grades.", good: false, f: "Pills from someone who isn't a doctor or pharmacist can be fake and deadly." },
        { t: "Block them and tell a trusted adult.", good: true, f: "Exactly right. That protects you and other kids." },
        { t: "Ask a friend to try them first.", good: false, f: "That puts your friend in danger. Block and report instead." } ] }
    ]
  };

  var BINGO = {
    "K-2": [
      ["💧","Drank water"],["🥦","Ate a veggie"],["🛌","Went to bed on time"],

      });
      var max = b === "6-8" ? 1000 : (b === "3-5" ? 500 : 200);
      var text = el("textarea", { maxlength: String(max), id: "futureText", placeholder: b === "K-2" ? "When I grow up I want to…" : (b === "6-8" ? "Dear future me…" : "My big dream is…") });
      if (b === "6-8") text.style.minHeight = "200px";
      var parts = [];
      if (b !== "6-8") parts.push(el("p", { class: "lead", text: "What do you want to be? Pick one (or skip)." }), dreamGrid);
      parts.push(el("label", { class: "field", for: "futureText", text: FUTURE_PROMPT[b] }), text, counter(text, max));
      activityShell(id, el("div", {}, parts), function () {
        var d = dreamGrid.querySelector('[aria-pressed="true"]');
        var v = text.value.trim();
        if (v.length < 3 && !d) return { error: b === "6-8" ? "Write your letter first." : "Pick a dream or write something first." };
        return { response: (d ? "Dream: " + d.getAttribute("data-name") + (v ? " — " : "") : "") + v };
      });
    }

    else if (id === "photo") {
      var pk = photoPicker("photoFile", "Tap to choose or take a photo");
      var kind = el("div", { class: "chips", role: "group", "aria-label": "What is in your photo" });
      ["🎉 Spirit day outfit", "🖍️ My poster", "🎗️ Red ribbon decoration", "✨ Something else"].forEach(function (txt) {
        var c = el("button", { type: "button", class: "chip", "aria-pressed": "false", text: txt });
        c.addEventListener("click", function () { pickOne(kind, c); });
        kind.appendChild(c);
      });
      var caption = el("input", { type: "text", maxlength: "150", id: "caption", placeholder: "Tell Mrs. Pernal about your photo (optional)" });

      activityShell(id, el("div", {}, [
        el("p", { class: "lead", text: "Share a picture of your poster, your red ribbon decorations, or anything Red Ribbon Week with " + COUNSELOR.name + "!" }),
        pk.node,
        el("label", { class: "field", text: "What's in your photo?" }), kind,
        el("label", { class: "field", for: "caption", text: "Caption" }), caption
      ]), function () {
        var ph = pk.get();
        if (!ph) return { error: "Choose a photo first." };
        if (ph.error) return { error: ph.error };
        var k = kind.querySelector('[aria-pressed="true"]');
        if (!k) return { error: "Tell us what's in your photo." };
        return {
          response: k.textContent.replace(/^\S+\s/, "") + (caption.value.trim() ? " — " + caption.value.trim() : ""),
          photo: ph
        };
      });
    }
  }

  /* A photo chooser with preview and the "grown-up said okay" checkbox.
     get() returns null (no photo), {error}, or {dataUrl, thumbUrl}. */
  function photoPicker(inputId, prompt) {
    var data = null, busy = false;
    var input = el("input", { type: "file", accept: "image/*", id: inputId });
    var text = el("span", { text: prompt });
    var drop = el("label", { class: "drop", for: inputId }, [el("span", { class: "big", "aria-hidden": "true", text: "📷" }), text, el("span", { class: "hint", text: "JPG or PNG" }), input]);
    var preview = el("img", { class: "preview-img hidden", alt: "Your photo" });
    var msg = el("div", { class: "status", role: "status" });
    var okay = el("input", { type: "checkbox", id: inputId + "Okay" });
    var okayRow = el("label", { class: "check hidden", for: inputId + "Okay", style: "margin-top:14px" }, [okay, "A grown-up at home said it's okay to send this photo."]);
    var remove = el("button", { type: "button", class: "linkbtn hidden", text: "Remove photo", style: "display:block;margin:8px auto 0" });

    function clear() {
      data = null; busy = false; input.value = ""; okay.checked = false;
      preview.classList.add("hidden"); okayRow.classList.add("hidden"); remove.classList.add("hidden");
      text.textContent = prompt; msg.textContent = "";
    }
    remove.addEventListener("click", clear);
    input.addEventListener("change", function () {
      var f = input.files && input.files[0];
      data = null; preview.classList.add("hidden"); msg.textContent = "";
      if (!f) return;
      if (!/^image\//.test(f.type)) { msg.className = "status err"; msg.textContent = "That file isn't a picture. Try a JPG or PNG."; return; }
      busy = true; msg.className = "status"; msg.textContent = "Getting your photo ready…";
      shrinkImage(f, function (err, full, thumb) {
        busy = false;
        if (err) { msg.className = "status err"; msg.textContent = "Hmm, we couldn't open that picture. Try a different one."; return; }
        data = { dataUrl: full, thumbUrl: thumb };
        preview.src = full; preview.classList.remove("hidden");
        okayRow.classList.remove("hidden"); remove.classList.remove("hidden");
        text.textContent = "Tap to pick a different photo"; msg.textContent = "";
      });
    });
    return {
      node: el("div", {}, [drop, preview, remove, msg, okayRow]),
      reset: clear,
      get: function () {
        if (busy) return { error: "Hang on, your photo is still getting ready." };
        if (!data) return null;
        if (!okay.checked) return { error: "Ask a grown-up, then check the box under your photo." };
        return data;
      }
    };
  }

  /* Shrinks a photo so it uploads quickly (max side in pixels, saved as JPEG). */
  function shrinkImage(file, done) {
    var reader = new FileReader();
    reader.onerror = function () { done(new Error("read")); };
    reader.onload = function () {
      var img = new Image();
      img.onerror = function () { done(new Error("decode")); };
      img.onload = function () {
        function render(maxSide, quality) {
          var scale = Math.min(1, maxSide / Math.max(img.width, img.height));
          var c = document.createElement("canvas");
          c.width = Math.max(1, Math.round(img.width * scale)); c.height = Math.max(1, Math.round(img.height * scale));
          var ctx = c.getContext("2d");
          ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
          ctx.drawImage(img, 0, 0, c.width, c.height);
          return c.toDataURL("image/jpeg", quality);
        }
        // Full photo for Drive, small thumbnail to show inside the spreadsheet.
        done(null, render(1600, 0.85), render(300, 0.75));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  /* ---------- Start ---------- */
  if (state.name) showMenu(); else showWelcome();
})();
</script>
